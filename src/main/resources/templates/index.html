<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MotOwner - Simulador de Créditos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f7f6; }
        .container { max-width: 500px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #27ae60; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #219150; }
    </style>
</head>
<body>

<div class="container">
    <h2>Simulador de Cuotas MotOwner</h2>
    <form th:action="@{/simular}" method="post">
        <div class="form-group">
            <label for="nombreCliente">Nombre del Cliente:</label>
            <input type="text" id="nombreCliente" name="nombreCliente" placeholder="Ej. Juan Pérez" required>
        </div>
        <div class="form-group">
            <label for="valorMoto">Valor de la Moto ($):</label>
            <input type="number" id="valorMoto" name="valorMoto" placeholder="Ej. 7000000" min="1" required>
        </div>
        <button type="submit">Calcular y Guardar Simulación</button>
    </form>
</div>

</body>
</html>
